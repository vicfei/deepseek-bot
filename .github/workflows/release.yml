# 发布到 PyPI(trusted publishing/OIDC,零密钥):打 v* tag 触发。
# 前提:PyPI Publishing 页已配置 pending publisher(owner=vicfei,
# repo=deepseek-bot, workflow=release.yml, environment 留空)。
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC:PyPI 按仓库+工作流签发一次性发布凭据,零存密
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

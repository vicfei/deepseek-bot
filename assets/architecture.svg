<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <rect width="1200" height="600" fill="#0e1428"/>
  <text x="600" y="44" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Architecture — one process tree, one ledger</text>
  <g font-size="15">
    <rect x="70" y="80" rx="10" width="180" height="52" fill="#16204a" stroke="#31427e"/>
    <text x="160" y="102" fill="#dbe4ff" text-anchor="middle" font-weight="600">WeChat (iLink)</text>
    <text x="160" y="122" fill="#8fa3d8" text-anchor="middle" font-size="12">text · voice · image</text>
    <rect x="70" y="148" rx="10" width="180" height="52" fill="#16204a" stroke="#31427e"/>
    <text x="160" y="170" fill="#dbe4ff" text-anchor="middle" font-weight="600">WebChat / WS</text>
    <text x="160" y="190" fill="#8fa3d8" text-anchor="middle" font-size="12">loopback · owner</text>
    <rect x="70" y="216" rx="10" width="180" height="52" fill="#16204a" stroke="#31427e"/>
    <text x="160" y="238" fill="#dbe4ff" text-anchor="middle" font-weight="600">Scheduler</text>
    <text x="160" y="258" fill="#8fa3d8" text-anchor="middle" font-size="12">cron · NL-compiled jobs</text>

    <rect x="330" y="110" rx="10" width="200" height="120" fill="#1a2350" stroke="#7aa2ff"/>
    <text x="430" y="140" fill="#ffffff" text-anchor="middle" font-weight="700">Gateway lanes</text>
    <text x="430" y="164" fill="#b9c6ea" text-anchor="middle" font-size="13">session → lane (sha256)</text>
    <text x="430" y="184" fill="#b9c6ea" text-anchor="middle" font-size="13">per-session serialization</text>
    <text x="430" y="204" fill="#b9c6ea" text-anchor="middle" font-size="13">trust gates on assembly</text>

    <rect x="610" y="80" rx="10" width="230" height="150" fill="#16204a" stroke="#31427e"/>
    <text x="725" y="108" fill="#ffffff" text-anchor="middle" font-weight="700">Agent loop</text>
    <text x="725" y="132" fill="#b9c6ea" text-anchor="middle" font-size="13">web search (worker subprocess)</text>
    <text x="725" y="152" fill="#b9c6ea" text-anchor="middle" font-size="13">sub-agent spawning (algebra)</text>
    <text x="725" y="172" fill="#b9c6ea" text-anchor="middle" font-size="13">introspection tools</text>
    <text x="725" y="192" fill="#b9c6ea" text-anchor="middle" font-size="13">skill recall · memory recall</text>

    <rect x="920" y="80" rx="10" width="210" height="150" fill="#3a2410" stroke="#8a5a20"/>
    <text x="1025" y="108" fill="#ffd9a8" text-anchor="middle" font-weight="700">Evolution loops</text>
    <text x="1025" y="132" fill="#e8c290" text-anchor="middle" font-size="13">skill sediment → shadow → promote</text>
    <text x="1025" y="152" fill="#e8c290" text-anchor="middle" font-size="13">GEPA weekly optimizer</text>
    <text x="1025" y="172" fill="#e8c290" text-anchor="middle" font-size="13">model routing (downward only)</text>
    <text x="1025" y="192" fill="#e8c290" text-anchor="middle" font-size="13">curator + consolidation</text>

    <rect x="330" y="270" rx="10" width="800" height="70" fill="#12331f" stroke="#2c6b45"/>
    <text x="730" y="298" fill="#d9ffe6" text-anchor="middle" font-weight="700">Hash-chained ledger — every state change is an append-only, revertible entry</text>
    <text x="730" y="322" fill="#a8e6bd" text-anchor="middle" font-size="13">skill commits · memory writes (encrypted) · job fires · session lifecycle · constitution anchors</text>

    <rect x="330" y="366" rx="10" width="250" height="64" fill="#16204a" stroke="#31427e"/>
    <text x="455" y="390" fill="#dbe4ff" text-anchor="middle" font-weight="600">CAS object store</text>
    <text x="455" y="410" fill="#8fa3d8" text-anchor="middle" font-size="12">skills · traces · encrypted memories</text>
    <rect x="612" y="366" rx="10" width="250" height="64" fill="#16204a" stroke="#31427e"/>
    <text x="737" y="390" fill="#dbe4ff" text-anchor="middle" font-weight="600">SQLite projections</text>
    <text x="737" y="410" fill="#8fa3d8" text-anchor="middle" font-size="12">rebuildable from ledger replay</text>
    <rect x="894" y="366" rx="10" width="236" height="64" fill="#16204a" stroke="#31427e"/>
    <text x="1012" y="390" fill="#dbe4ff" text-anchor="middle" font-weight="600">Key store (DEK/KEK)</text>
    <text x="1012" y="410" fill="#8fa3d8" text-anchor="middle" font-size="12">crypto-forgetting escrow</text>

    <rect x="70" y="366" rx="10" width="200" height="120" fill="#2c1a33" stroke="#7a4a8a"/>
    <text x="170" y="394" fill="#f0d9ff" text-anchor="middle" font-weight="700">Constitution</text>
    <text x="170" y="418" fill="#d9bfe6" text-anchor="middle" font-size="13">anchored in ledger</text>
    <text x="170" y="438" fill="#d9bfe6" text-anchor="middle" font-size="13">daily re-verify</text>
    <text x="170" y="458" fill="#d9bfe6" text-anchor="middle" font-size="13">drift ⇒ graceful fuse</text>

    <path d="M250 106 C 290 106, 300 150, 330 160" stroke="#8fa3d8" stroke-width="2" fill="none"/>
    <path d="M250 174 C 285 174, 295 175, 330 172" stroke="#8fa3d8" stroke-width="2" fill="none"/>
    <path d="M250 242 C 290 242, 300 205, 330 195" stroke="#8fa3d8" stroke-width="2" fill="none"/>
    <path d="M530 170 L610 165" stroke="#8fa3d8" stroke-width="2"/>
    <path d="M840 155 L920 150" stroke="#e8c290" stroke-width="2"/>
    <path d="M725 230 L730 270" stroke="#5fd68a" stroke-width="2"/>
    <path d="M270 340 L200 366" stroke="#d9bfe6" stroke-width="2"/>
  </g>
  <text x="600" y="540" font-size="13" fill="#66759f" text-anchor="middle">K.3 (planned): privilege decisions — trust, budgets, R-gates, memory write-gate, constitution — move to a separate process over IPC</text>
</svg>
